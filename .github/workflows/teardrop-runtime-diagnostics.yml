name: Teardrop Bedrock Diagnostics

on:
  push:
    branches: [teardrop-load-fix]
  workflow_dispatch:

jobs:
  bedrock-gates:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct reported failing v1.2.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/teardrop/project/BP /tmp/teardrop/project/RP /tmp/teardrop/logs
          cat ci/teardrop_v1.2.0.part*.b64 | base64 -d > /tmp/teardrop/Teardrop_v1.2.0.mcaddon
          unzip -q /tmp/teardrop/Teardrop_v1.2.0.mcaddon -d /tmp/teardrop/outer
          unzip -q /tmp/teardrop/outer/Teardrop_BP.mcpack -d /tmp/teardrop/project/BP
          unzip -q /tmp/teardrop/outer/Teardrop_RP.mcpack -d /tmp/teardrop/project/RP
          unzip -t /tmp/teardrop/Teardrop_v1.2.0.mcaddon | tee /tmp/teardrop/logs/archive.txt

      - name: Install Mojang Minecraft Creator Tools
        run: npm install -g @minecraft/creator-tools

      - name: Official Creator Tools validation
        id: mctvalidate
        shell: bash
        run: |
          set +e
          mct version 2>&1 | tee /tmp/teardrop/logs/mct-version.txt
          mct validate addon -i /tmp/teardrop/project -v --json 2>&1 | tee /tmp/teardrop/logs/creator-tools.json
          code=${PIPESTATUS[0]}
          mct validate addon -i /tmp/teardrop/project -v 2>&1 | tee /tmp/teardrop/logs/creator-tools.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Creator Tools exit code: $code"
          exit 0

      - name: Download current official Bedrock Dedicated Server
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/teardrop
          api='https://net-secondary.web.minecraft-services.net/api/v1.0/download/links'
          curl -fsSL "$api" -o download-links.json
          url=$(jq -r '.result.links[] | select(.downloadType=="serverBedrockLinux") | .downloadUrl' download-links.json | head -1)
          test -n "$url" && test "$url" != "null"
          echo "$url" | tee logs/bds-download-url.txt
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$url" -o bedrock-server.zip
          mkdir bds
          unzip -q bedrock-server.zip -d bds
          test -x bds/bedrock_server

      - name: Configure isolated Bedrock world with Teardrop packs
        shell: bash
        run: |
          set -euo pipefail
          BDS=/tmp/teardrop/bds
          WORLD="$BDS/worlds/TeardropLoadTest"
          mkdir -p "$BDS/behavior_packs/Teardrop_BP" "$BDS/resource_packs/Teardrop_RP" "$WORLD"
          cp -a /tmp/teardrop/project/BP/. "$BDS/behavior_packs/Teardrop_BP/"
          cp -a /tmp/teardrop/project/RP/. "$BDS/resource_packs/Teardrop_RP/"
          cat > "$WORLD/world_behavior_packs.json" <<'JSON'
          [
            {"pack_id":"c9e00f9a-25b3-4f6d-b239-d5465e0b5d22","version":[1,2,0]}
          ]
          JSON
          cat > "$WORLD/world_resource_packs.json" <<'JSON'
          [
            {"pack_id":"3418d8d9-321a-4de3-9182-c363ce8ec8c5","version":[1,2,0]}
          ]
          JSON
          sed -i 's/^level-name=.*/level-name=TeardropLoadTest/' "$BDS/server.properties"
          sed -i 's/^online-mode=.*/online-mode=false/' "$BDS/server.properties"
          sed -i 's/^allow-cheats=.*/allow-cheats=true/' "$BDS/server.properties"
          grep -E '^(level-name|online-mode|allow-cheats)=' "$BDS/server.properties" | tee /tmp/teardrop/logs/server-properties.txt

      - name: Boot real Bedrock Dedicated Server and capture content load
        id: bdsboot
        shell: bash
        run: |
          set +e
          cd /tmp/teardrop/bds
          timeout --signal=INT --kill-after=5s 35s env LD_LIBRARY_PATH=. ./bedrock_server 2>&1 | tee /tmp/teardrop/logs/bds.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "BDS process exit code: $code (124/130 after timeout is expected once startup has been observed)" | tee -a /tmp/teardrop/logs/bds.txt
          exit 0

      - name: Extract Bedrock load errors
        shell: bash
        run: |
          set +e
          log=/tmp/teardrop/logs/bds.txt
          grep -Ei 'error|failed|invalid|exception|warning|content log|pack' "$log" > /tmp/teardrop/logs/bds-errors-and-pack-lines.txt
          cat /tmp/teardrop/logs/bds-errors-and-pack-lines.txt
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: teardrop-v1.2.0-bedrock-diagnostics
          path: /tmp/teardrop/logs
          if-no-files-found: error

      - name: Report official static gate result
        if: steps.mctvalidate.outputs.exit_code != '0'
        run: |
          echo "Official Minecraft Creator Tools rejected the add-on."
          exit 1
