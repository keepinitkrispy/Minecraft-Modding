name: Teardrop v1.2.1 Release Gate

on:
  push:
    branches: [teardrop-load-fix]
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct exact reported-failing v1.2.0 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/teardrop/project/BP /tmp/teardrop/project/RP /tmp/teardrop/logs
          cat ci/teardrop_v1.2.0.part*.b64 | base64 -d > /tmp/teardrop/Teardrop_v1.2.0.mcaddon
          unzip -q /tmp/teardrop/Teardrop_v1.2.0.mcaddon -d /tmp/teardrop/outer
          unzip -q /tmp/teardrop/outer/Teardrop_BP.mcpack -d /tmp/teardrop/project/BP
          unzip -q /tmp/teardrop/outer/Teardrop_RP.mcpack -d /tmp/teardrop/project/RP
          unzip -t /tmp/teardrop/Teardrop_v1.2.0.mcaddon | tee /tmp/teardrop/logs/v1.2.0-archive.txt

      - name: Build sealed v1.2.1 candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_teardrop_v121.py /tmp/teardrop/project /tmp/teardrop/Teardrop_v1.2.1.mcaddon
          unzip -t /tmp/teardrop/Teardrop_v1.2.1.mcaddon | tee /tmp/teardrop/logs/v1.2.1-archive.txt
          sha256sum /tmp/teardrop/Teardrop_v1.2.1.mcaddon | tee /tmp/teardrop/logs/v1.2.1-sha256.txt

      - name: Install Mojang Minecraft Creator Tools
        run: npm install -g @minecraft/creator-tools

      - name: Fail-closed Mojang all-suite validation
        shell: bash
        run: |
          set -euo pipefail
          mct version | tee /tmp/teardrop/logs/mct-version.txt
          python scripts/validate_with_creator_tools.py /tmp/teardrop/project \
            --suite all --fail-on-warnings --log /tmp/teardrop/logs/creator-tools-all.txt

      - name: Fail-closed Mojang Add-On relationship validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_with_creator_tools.py /tmp/teardrop/project \
            --suite addon --fail-on-warnings --log /tmp/teardrop/logs/creator-tools-addon.txt

      - name: Download current official Bedrock Dedicated Server
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/teardrop
          api='https://net-secondary.web.minecraft-services.net/api/v1.0/download/links'
          curl -fsSL "$api" -o download-links.json
          url=$(jq -r '.result.links[] | select(.downloadType=="serverBedrockLinux") | .downloadUrl' download-links.json | head -1)
          test -n "$url" && test "$url" != "null"
          echo "$url" | tee logs/bds-download-url.txt
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$url" -o bedrock-server.zip
          mkdir bds
          unzip -q bedrock-server.zip -d bds
          test -x bds/bedrock_server

      - name: Configure isolated Bedrock world with release packs only
        shell: bash
        run: |
          set -euo pipefail
          BDS=/tmp/teardrop/bds
          WORLD="$BDS/worlds/TeardropLoadTest"
          mkdir -p "$BDS/behavior_packs/Teardrop_BP" "$BDS/resource_packs/Teardrop_RP" "$WORLD"
          cp -a /tmp/teardrop/project/BP/. "$BDS/behavior_packs/Teardrop_BP/"
          cp -a /tmp/teardrop/project/RP/. "$BDS/resource_packs/Teardrop_RP/"
          cat > "$WORLD/world_behavior_packs.json" <<'JSON'
          [
            {"pack_id":"c9e00f9a-25b3-4f6d-b239-d5465e0b5d22","version":[1,2,1]}
          ]
          JSON
          cat > "$WORLD/world_resource_packs.json" <<'JSON'
          [
            {"pack_id":"3418d8d9-321a-4de3-9182-c363ce8ec8c5","version":[1,2,1]}
          ]
          JSON
          sed -i 's/^level-name=.*/level-name=TeardropLoadTest/' "$BDS/server.properties"
          sed -i 's/^online-mode=.*/online-mode=false/' "$BDS/server.properties"
          sed -i 's/^allow-list=.*/allow-list=false/' "$BDS/server.properties"
          sed -i 's/^allow-cheats=.*/allow-cheats=true/' "$BDS/server.properties"
          sed -i 's/^content-log-console-output-enabled=.*/content-log-console-output-enabled=true/' "$BDS/server.properties"

      - name: Real Bedrock boot + Teardrop summon gate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/teardrop/bds
          {
            sleep 8
            echo 'tickingarea add circle 0 80 0 1 teardrop_release_ci true'
            sleep 5
            echo 'summon junk_bunch:teardrop 0 80 0'
            sleep 2
            echo 'testfor @e[type=junk_bunch:teardrop]'
            sleep 2
            echo 'stop'
          } | timeout --signal=INT --kill-after=5s 40s env LD_LIBRARY_PATH=. ./bedrock_server 2>&1 \
            | tee /tmp/teardrop/logs/bds-release.txt || code=$?
          code=${code:-0}
          echo "BDS process exit code: $code" | tee -a /tmp/teardrop/logs/bds-release.txt

          grep -F 'Junk Bunch - Teardrop BP' /tmp/teardrop/logs/bds-release.txt
          grep -F 'version: 1.2.1' /tmp/teardrop/logs/bds-release.txt
          grep -F 'Server started.' /tmp/teardrop/logs/bds-release.txt
          grep -F 'Added ticking area' /tmp/teardrop/logs/bds-release.txt
          grep -F 'Object successfully summoned' /tmp/teardrop/logs/bds-release.txt
          grep -F 'Found entity.junk_bunch:teardrop.name' /tmp/teardrop/logs/bds-release.txt

          if grep -E '\[[^]]+ ERROR\]' /tmp/teardrop/logs/bds-release.txt; then
            echo 'FAIL: Bedrock emitted an ERROR during release gate.'
            exit 1
          fi
          if grep -F 'Unable to summon object' /tmp/teardrop/logs/bds-release.txt; then
            echo 'FAIL: Teardrop could not be summoned.'
            exit 1
          fi

      - name: Write release-gate summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'TEARDROP v1.2.1 RELEASE GATE'
            echo '================================'
            echo 'Mojang Creator Tools all suite: PASS, fail-closed, 0 errors / 0 warnings'
            echo 'Mojang Creator Tools addon suite: PASS, fail-closed, 0 errors / 0 warnings'
            echo 'Bedrock Dedicated Server: PASS'
            grep -m1 'Version:' /tmp/teardrop/logs/bds-release.txt
            echo 'Pack stack: Teardrop BP 1.2.1 loaded'
            echo 'Ticking area: preloaded before entity test'
            echo 'Entity summon: junk_bunch:teardrop successfully summoned and found'
            echo 'Archive CRC: PASS'
            cat /tmp/teardrop/logs/v1.2.1-sha256.txt
            echo
            echo 'BOUNDARY: Android/PS5 client-side resource rendering and interaction still require the real client test.'
          } | tee /tmp/teardrop/Teardrop_v1.2.1_validation.txt

      - name: Upload exact tested add-on
        uses: actions/upload-artifact@v4
        with:
          name: Teardrop-v1.2.1-tested
          path: /tmp/teardrop/Teardrop_v1.2.1.mcaddon
          if-no-files-found: error

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: Teardrop-v1.2.1-validation
          path: /tmp/teardrop/Teardrop_v1.2.1_validation.txt
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Teardrop-v1.2.1-diagnostics
          path: /tmp/teardrop/logs
          if-no-files-found: error
