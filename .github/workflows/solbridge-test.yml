name: SolBridge test

on:
  push:
    branches: [solbridge-v1]
    paths:
      - 'solbridge/**'
      - '.github/workflows/solbridge-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ./solbridge pytest
      - run: pytest -q ./solbridge/tests
      - run: python -m py_compile ./solbridge/deploy_guardian.py ./solbridge/deploy_guardian_heartbeat.py ./solbridge/guardian_recovery_fault_test.py
      - name: Compile native companion Java
        shell: bash
        run: |
          set -euo pipefail
          android_jar="$(find "$ANDROID_HOME/platforms" -name android.jar -type f | sort -V | tail -1)"
          test -n "$android_jar"
          mkdir -p /tmp/solbridge-companion-classes
          javac -source 11 -target 11 -cp "$android_jar" -d /tmp/solbridge-companion-classes \
            solbridge/native-companion-template/src/dev/solbridge/companion/*.java
