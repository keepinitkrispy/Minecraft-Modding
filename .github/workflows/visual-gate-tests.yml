name: Visual Gate Regression Tests

on:
  push:
  pull_request:

jobs:
  visual-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run visual gate regression tests
        run: python -m unittest tests.test_visual_gates -v
